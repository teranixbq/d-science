{{ define "main" }}
<div class="article-content">
    <h1>{{ .Title }}</h1>
    <p>{{ .Content }}</p>
    
    <!-- Section Filter Dropdown -->
    <div class="archive-filter" style="margin: 2rem 0;">
        <label for="section-select" style="font-family: var(--font-mono); font-weight: 700; margin-right: 1rem;">{{ i18n "filter_by_section" }}:</label>
        <select id="section-select" style="font-family: var(--font-mono); padding: 0.5rem 1rem; border: 2px solid var(--border-primary); background: var(--bg-primary); color: var(--text-primary);">
            {{ $sections := slice }}
            {{ range .Site.RegularPages }}
                {{ if and (ne .Section "") (not (in $sections .Section)) }}
                    {{ $sections = $sections | append .Section }}
                {{ end }}
            {{ end }}
            {{ range sort ($sections | uniq) }}
            {{ $sectionPages := where $.Site.RegularPages "Section" . }}
            <option value="{{ . }}">{{ . | title }} ({{ len $sectionPages }})</option>
            {{ end }}
        </select>
    </div>

    <!-- Articles Container -->
    <div id="articles-container" class="list-container" data-no-articles="{{ i18n "no_articles_in_section" | default "No articles found in this section." }}">
        <!-- Articles will be inserted here by JavaScript -->
    </div>
</div>

<script>
(function() {
    'use strict';
    
    // Build articles data grouped by section
    const articlesBySection = {
        {{ $sections := slice }}
        {{ range .Site.RegularPages }}
            {{ if and (ne .Section "") (not (in $sections .Section)) }}
                {{ $sections = $sections | append .Section }}
            {{ end }}
        {{ end }}
        {{ range sort ($sections | uniq) }}
        {{ $section := . }}
        {{ $section | jsonify }}: [
            {{ range where $.Site.RegularPages "Section" $section }}
            {
                title: {{ .Title | plainify | jsonify }},
                url: {{ .RelPermalink | jsonify }},
                date: {{ .Date.Format "02/01/2006" | jsonify }}
            },
            {{ end }}
        ],
        {{ end }}
    };

    function init() {
        const select = document.getElementById('section-select');
        const container = document.getElementById('articles-container');
        
        if (!select || !container) {
            console.error('Archive elements not found');
            return;
        }

        function renderArticles(section) {
            const articles = articlesBySection[section] || [];
            
            if (articles.length === 0) {
                const msg = container.getAttribute('data-no-articles') || 'No articles found in this section.';
                container.innerHTML = '<p style="color: var(--text-muted);">' + msg + '</p>';
                return;
            }

            // Clear container first
            container.innerHTML = '';
            
            // Create article elements
            articles.forEach(article => {
                const articleEl = document.createElement('article');
                articleEl.className = 'list-article';
                articleEl.style.cursor = 'pointer';
                
                const dateEl = document.createElement('div');
                dateEl.className = 'list-article-date';
                dateEl.textContent = article.date;
                
                const titleEl = document.createElement('h2');
                titleEl.className = 'list-article-title';
                
                const linkEl = document.createElement('a');
                linkEl.href = article.url;
                linkEl.textContent = article.title;
                
                titleEl.appendChild(linkEl);
                articleEl.appendChild(dateEl);
                articleEl.appendChild(titleEl);
                
                // Add click handler to article element
                articleEl.addEventListener('click', function(e) {
                    // Prevent if clicking directly on link
                    if (e.target.tagName !== 'A') {
                        window.location.href = article.url;
                    }
                });
                
                container.appendChild(articleEl);
            });
        }

        // Set initial section
        if (select.options.length > 0) {
            const firstSection = select.options[0].value;
            renderArticles(firstSection);
        }

        // Handle section change
        select.addEventListener('change', function() {
            renderArticles(this.value);
        });
    }
    
    // Initialize when DOM is ready
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
{{ end }}
