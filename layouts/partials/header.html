<header>
    <a href="/" class="logo-box">
        {{ .Site.Title }}
    </a>
    <nav aria-label="Main navigation">
        {{ $currentURL := .RelPermalink }}
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"{{ if eq $currentURL .URL }} aria-current="page"{{ end }}>{{ .Name }}</a>
        {{ end }}
    </nav>
</header>
