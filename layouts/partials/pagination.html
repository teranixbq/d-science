{{ if gt .Paginator.TotalPages 1 }}
<nav class="pagination">
    {{ if .Paginator.HasPrev }}
    <a href="{{ .Paginator.Prev.URL }}" class="pagination-link">← {{ i18n "previous_page" }}</a>
    {{ end }}
    
    <span class="pagination-text">{{ i18n "page" }} {{ .Paginator.PageNumber }} {{ i18n "of" }} {{ .Paginator.TotalPages }}</span>

    {{ if .Paginator.HasNext }}
    <a href="{{ .Paginator.Next.URL }}" class="pagination-link">{{ i18n "next_page" }} →</a>
    {{ end }}
</nav>
{{ end }}
