<figure class="article-image">
    <img src="{{ .Destination | safeURL }}" 
         alt="{{ .Text }}" 
         {{ with .Title }}title="{{ . }}"{{ end }} 
         loading="lazy" 
         decoding="async"
         tabindex="0"
         role="button"
         aria-haspopup="dialog" />
    {{ with .Title }}
    <figcaption>{{ . }}</figcaption>
    {{ end }}
</figure>
