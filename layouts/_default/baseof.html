<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
{{ partial "head.html" . }}
<body>
    <div class="container">
        {{ partial "header.html" . }}

        <main>
            {{ block "main" . }}{{ end }}
        </main>


        {{ partial "footer.html" . }}
    </div>

    <!-- Lightbox Element -->
    <div id="lightbox" role="dialog" aria-modal="true" aria-label="{{ i18n "zoomed_image" | default "Zoomed Image" }}">
        <img id="lightbox-img" src="" alt="">
        <div id="lightbox-caption"></div>
    </div>

    <script>
    document.addEventListener("DOMContentLoaded", function() {
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const images = document.querySelectorAll('.article-image img');

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImg.src = '';
            lightbox.removeAttribute('aria-hidden');
        }

        images.forEach(img => {
            img.addEventListener('click', function() {
                lightboxImg.src = this.src;
                lightboxImg.alt = this.getAttribute('alt') || '';
                lightboxCaption.textContent = this.getAttribute('alt') || this.getAttribute('title') || '';
                lightbox.classList.add('active');
            });
        });

        lightbox.addEventListener('click', function(e) {
            if (e.target === lightbox) closeLightbox();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                closeLightbox();
            }
        });
    });
    </script>
</body>

</html>
